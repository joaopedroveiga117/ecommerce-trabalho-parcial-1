spring.application.name=ecommerce

# Caminho da conexão
spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce?createDatabaseIfNotExist=true&serverTimezone=America/Sao_Paulo

# Nome do usuário
spring.datasource.username=sergio

# Senha do usuário
spring.datasource.password=123@Mudar

# Driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Estratégia de criação
spring.jpa.hibernate.ddl-auto=create

# Exibição do SQL
spring.jpa.show-sql=true

# Formatação do SQL
spring.jpa.properties.hibernate.format_sql=true

# Dialeto
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.jpa.properties.jakarta.persistence.sql-load-script-source=import.sql
spring.jpa.properties.hibernate.hbm2ddl.import_files_sql_extractor=org.hibernate.tool.schema.internal.script.MultiLineSqlScriptExtractor
spring.jpa.properties.hibernate.hbm2ddl.halt_on_error=true